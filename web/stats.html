<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route-Fit 실증 통계</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Route-Fit</h1>
    <p>실증 통계</p>
    <nav><a href="/">코스 만들기</a><a href="/stats.html" aria-current="page">실증 통계</a><a href="/admin.html">장소 관리</a></nav>
  </header>

  <main class="page">
    <section class="toolbar">
      <p class="muted small">생성된 모든 코스를 집계합니다. <span id="updated"></span></p>
      <button type="button" id="refresh" class="inline secondary">새로고침</button>
    </section>

    <ul id="tiles" class="tiles" aria-live="polite"></ul>

    <div class="dash">
      <section class="panel dash-compare">
        <h2>코스 생성기 비교</h2>
        <p class="muted small">두 생성기가 만든 코스의 평균. 지역상권 비율은 AI 추천 장소 중 전통시장·골목상권·로컬카페의 비율입니다.</p>
        <div class="table-wrap"><table id="planners"></table></div>
      </section>

      <section class="panel dash-top">
        <h2>AI가 많이 추천한 장소</h2>
        <p class="muted small">코스에 AI 추천으로 들어간 횟수 (상위 10곳)</p>
        <ol id="top-places" class="bars"></ol>
      </section>

      <section class="panel dash-recent">
        <h2>최근 생성된 코스</h2>
        <div class="table-wrap">
          <table id="recent" class="clickable">
            <thead>
              <tr>
                <th>생성 시각</th><th>요청 문장</th><th>생성기</th>
                <th class="num">장소</th><th class="num">지역상권</th><th class="num">점수</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel dash-feedback">
        <h2>최근 한줄평</h2>
        <ul id="feedback" class="list"></ul>
      </section>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="stats.js"></script>
</body>
</html>
