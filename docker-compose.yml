# 시연용: PostgreSQL + Route-Fit 서버
#   docker compose up -d --build        -> http://localhost:8000
#   docker compose up -d db             -> DB 만 띄우고 서버는 로컬 .venv 로 실행할 때
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped  # 서버(PC)가 재부팅돼도 다시 켜진다. docker compose down/stop 으로 끈 경우는 그대로
    environment:
      POSTGRES_USER: routefit
      POSTGRES_PASSWORD: routefit
      POSTGRES_DB: routefit
    ports:
      - "5433:5432"  # 호스트에 PostgreSQL 이 이미 5432 를 쓰는 경우가 많아 5433 으로 연다
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routefit -d routefit"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://routefit:routefit@db:5432/routefit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
